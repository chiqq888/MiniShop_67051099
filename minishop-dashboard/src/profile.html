<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | MiniShop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  </head>

  <body data-current-page="profile" class="font-inter grid min-h-screen grid-cols-1 grid-rows-[auto_auto_1fr] md:grid-cols-[15rem_minmax(0,1fr)] md:grid-rows-[auto_1fr]">
    <nav class="border-b border-gray-200 bg-white md:col-span-2">

      <div class="flex w-full items-center justify-between px-4 py-4 sm:px-10">

        <!-- Logo -->
        <div>
          <h1 class="text-2xl font-bold text-blue-600">
            MiniShop
          </h1>
          <p class="text-sm text-gray-500">
            Online Shopping
          </p>
        </div>

        <div class="flex items-center gap-4 pl-4 sm:gap-10">
          <img src="/src/assets/minimalistic-magnifer-svgrepo-com.svg" alt="Search" class="h-7 w-7">
          <span class="relative inline-flex">
            <img src="/src/assets/cart-3-svgrepo-com.svg" alt="Cart" class="h-7 w-7">
            <span class="cart-count absolute -right-2 -top-2 min-w-5 rounded-full bg-blue-600 px-1 text-center text-xs font-semibold leading-5 text-white" aria-live="polite">0</span>
          </span>
          <img src="/src/assets/user-circle-svgrepo-com.svg" alt="Profile" class="h-7 w-7">
        </div>

      </div>
    </nav>

    <aside class="border-b border-gray-200 px-6 py-6 md:border-b-0 md:border-r" aria-label="Sidebar">
      <nav class="flex flex-col gap-1" aria-label="Main menu">
        <a class="sidebar-link" href="/src/dashboard.html" data-page="dashboard">
          <span class="sidebar-icon sidebar-icon-dashboard" aria-hidden="true"></span>
          <span>Dashboard</span>
        </a>
        <a class="sidebar-link" href="/src/products.html" data-page="products">
          <span class="sidebar-icon sidebar-icon-products" aria-hidden="true"></span>
          <span>Products</span>
        </a>
        <a class="sidebar-link" href="/src/profile.html" data-page="profile">
          <span class="sidebar-icon sidebar-icon-profile" aria-hidden="true"></span>
          <span>Profile</span>
        </a>
      </nav>
    </aside>

    <main class="min-w-0 bg-slate-50 px-5 py-8 md:px-8">
      <h1 class="mb-6 text-3xl font-bold text-slate-900">Profile</h1>

      <div class="grid gap-5 lg:grid-cols-[minmax(280px,2fr)_minmax(0,3fr)]">
        <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="profile-name">
          <div class="flex flex-col items-center text-center">
            <div class="flex h-32 w-32 items-center justify-center rounded-full bg-blue-100 text-blue-600">
              <span class="profile-avatar-icon" aria-hidden="true"></span>
            </div>
            <h2 id="profile-name" class="mt-5 text-2xl font-bold text-slate-900">Ratchatapong Atteephok</h2>
          </div>

          <div class="mt-7 space-y-4 text-slate-700">
            <p class="flex items-center gap-3">
              <span class="profile-contact-icon profile-contact-email" aria-hidden="true"></span>
              <span class="break-all">67051099@kmitl.ac.th</span>
            </p>
            <p class="flex items-center gap-3">
              <span class="profile-contact-icon profile-contact-student" aria-hidden="true"></span>
              <span>Student ID: 67051099</span>
            </p>
          </div>

          <button type="button" class="mt-8 w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-700">Edit Profile</button>
        </section>

        <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="account-summary-heading">
          <h2 id="account-summary-heading" class="mb-5 text-xl font-semibold text-slate-900">Account Summary</h2>

          <div class="grid gap-4 sm:grid-cols-2">
            <article class="rounded-xl bg-blue-50 p-5">
              <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-blue-100 text-blue-600">
                <span class="metric-icon metric-icon-orders" aria-hidden="true"></span>
              </div>
              <h3 class="mt-3 font-medium text-slate-700">Total Orders</h3>
              <p class="mt-1 text-2xl font-bold text-slate-900">128</p>
            </article>

            <article class="rounded-xl bg-violet-50 p-5">
              <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-violet-100 text-violet-700">
                <span class="metric-icon metric-icon-revenue" aria-hidden="true"></span>
              </div>
              <h3 class="mt-3 font-medium text-slate-700">Total Spent</h3>
              <p class="mt-1 text-2xl font-bold text-slate-900">฿48,500</p>
            </article>

            <article class="rounded-xl bg-emerald-50 p-5">
              <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-emerald-100 text-emerald-700">
                <span class="metric-icon metric-icon-products" aria-hidden="true"></span>
              </div>
              <h3 class="mt-3 font-medium text-slate-700">Wishlist Items</h3>
              <p class="mt-1 text-2xl font-bold text-slate-900">6</p>
            </article>

            <article class="rounded-xl bg-amber-50 p-5">
              <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-amber-100 text-amber-700">
                <span class="metric-icon metric-icon-loyalty" aria-hidden="true"></span>
              </div>
              <h3 class="mt-3 font-medium text-slate-700">Loyalty Points</h3>
              <p class="mt-1 text-2xl font-bold text-slate-900">320</p>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
